                <td colspan="3">全部庫存總計</td>
                <td id="js-inv-global-普">0</td>
                <td id="js-inv-global-異">0</td>
                <td id="js-inv-global-幻">0</td>
                <td id="js-inv-global-總">0</td>
            `;
            invBody.appendChild(globalSumTr);

            // 依稀有度建立背包內容列
            categories.forEach(cat => {
                // 列：各系列列
                const catTr = document.createElement('tr'); 
                catTr.innerHTML = `<td colspan="7" class="c-cat-row">★ ${cat}系列</td>`; 
                invBody.appendChild(catTr);
                // 列：系列加總
                const sumTr = document.createElement('tr'); 
                sumTr.classList.add('c-cat-sum-row');
                sumTr.id = `js-inv-sum-${cat}`;
                sumTr.innerHTML = `
                    <td colspan="3" class="c-text-indent-lg">系列加總</td>
                    <td id="js-inv-sum-${cat}-普">0</td>
                    <td id="js-inv-sum-${cat}-異">0</td>
                    <td id="js-inv-sum-${cat}-幻">0</td>
                    <td id="js-inv-sum-${cat}-總">0</td>
                `;
                invBody.appendChild(sumTr);

                cropsData[cat].forEach(c => {
                    const wVal = window[`weight_${c.short}`];
                    const formattedWeight = typeof wVal === 'number' ? wVal.toFixed(1) : "0.0";
                    const displayPrice = c.price;

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="t-${cat} c-clickable-crop c-text-indent-sm" data-short="${c.short}">${c.name}</td>
                        <td><input type="text" class="c-inv-static-input" value="${formattedWeight}" readonly tabindex="-1" data-weight-val="${formattedWeight}"></td>
                        <td><input type="text" class="c-inv-static-input" value="${displayPrice}"    readonly tabindex="-1"></td>

                        <td><input type="number" class="c-inv-input js-inv-input" data-short="${c.short}" data-cat="${cat}" data-mode="普" min="0" max="99999" placeholder="-"></td>
                        <td><input type="number" class="c-inv-input js-inv-input" data-short="${c.short}" data-cat="${cat}" data-mode="異" min="0" max="99999" placeholder="-"></td>
                        <td><input type="number" class="c-inv-input js-inv-input" data-short="${c.short}" data-cat="${cat}" data-mode="幻" min="0" max="99999" placeholder="-"></td>
                        
                        <td id="js-total-${c.short}" class="c-inv-total-display">0</td>
                    `;
                    invBody.appendChild(tr);
                });
            });

            // 背包作物名稱點擊快速選取刷子
            document.querySelectorAll('.c-clickable-crop').forEach(element => {
                element.addEventListener('click', () => selectCrop(element.getAttribute('data-short')));
            });

            // 監聽背包輸入數值自動存檔與計算（加入 0-99999 與長度限制）
            invBody.addEventListener('input', (e) => {
                // 確保觸發事件的是背包輸入框
                if (e.target && e.target.classList.contains('js-inv-input')) {
                    let input = e.target;
                    
                    // 1. 長度限制：最多只能打 5 個字元
                    if (input.value.length > 5) {
                        input.value = input.value.slice(0, 5);
                    }

                    // 2. 數值範圍限制：負數修正為 0，超過 99999 修正為 99999
                    let val = parseInt(input.value, 10);
                    if (!isNaN(val)) {
                        if (val < 0    ) input.value = 0;
                        if (val > 99999) input.value = 99999;
                    }
                }

                // 執行原有的計算與存檔
                calculateInvTotals(); 
                autoSaveData();
            });

            // 綁定地圖單元格監聽事件
            bindCellEvents();
            
            // 下拉選單連動快捷按鈕外觀
            cropSelect.addEventListener('change', () => syncQuickCropButtons(cropSelect.value));

            // 預設選取「大王菊」並同步「塗鴉按鈕 UI」
            selectCrop('大王');
            syncDragModeUI();

            // 獨立出的地圖耕地事件綁定輔助函式
            function bindCellEvents() {
                const cells = document.querySelectorAll('.js-cell');
                cells.forEach(cell => {
                    cell.addEventListener('mousedown', () => { isMouseDown = true; handleCellClick(cell); });
                    cell.addEventListener('mouseenter', () => { 
                        if (isDragMode && isMouseDown && moveModeState === 'off' && copyModeState === 'off') applyBrush(cell); 
                        if (cell.dataset.crop) highlightRowInStats(cell.dataset.crop);
                        highlightCrossAxes(cell, true); 
                    });
                    cell.addEventListener('mouseleave', () => {
                        clearStatsHighlight();
                        highlightCrossAxes(cell, false); 
                    });
                });
            }
        }

        // ============================================================
        // 【區塊四】作物選擇高亮與連動同步
        // ============================================================

        function selectCrop(shortName) {
            if(currentStyle === '清') setBrushStyle('普');
            document.getElementById('js-cropSelect').value = shortName;
            syncQuickCropButtons(shortName);
        }

        function syncQuickCropButtons(activeShort) {
            document.querySelectorAll('.c-quick-crop-btn').forEach(btn => {
                if(btn.dataset.short === activeShort) btn.classList.add    ('c-active');
                else                                  btn.classList.remove ('c-active');
            });
        }

        // ============================================================
        // 【區塊五】背包種子庫存數據加總與渲染
        // ============================================================
        
        // 數值格式化輔助函式：大於 0 時顯示千分位，0 或無數值時顯示指定符號（預設為 "-"）
        function formatNum(val, zeroChar = '-') {
            const  num = Number(val) || 0;
            return num > 0 ? num.toLocaleString() : zeroChar;
        }

        function calculateInvTotals() {
            // 1. 定義六種稀有度系列與三種型態的陣列
            const categories = ['至臻', '橙色', '紫色', '藍色', '綠色', '灰色'];
            const modes      = ['普'  , '異'  , '幻'];
            
            // 2. 初始化全場跨系列的加總物件
            const globalSums = { '普': 0, '異': 0, '幻': 0, '總': 0 };
            
            // 3. 初始化各稀有度系列的加總物件
            const catSums = {};
            categories.forEach(cat => {
                catSums[cat] = { '普': 0, '異': 0, '幻': 0, '總': 0 };
            });
            
            // 4. 建立暫存單一作物累加總數的物件
            const cropRowTotals = {};
            
            // 5. 抓取所有背包輸入框並進行迭代計算
            const inputs = document.querySelectorAll('.js-inv-input');
            inputs.forEach(input => {
                const short = input.dataset.short;
                const cat   = input.dataset.cat;
                const mode  = input.dataset.mode;
                const val   = parseInt(input.value) || 0;

                // 累加到該系列的型態加總，以及全場的型態加總
                if (modes.includes(mode)) {
                    catSums[cat][mode] += val;
                    globalSums[mode]   += val;

                    // 累加到該作物的單列總計
                    if (!cropRowTotals[short]) cropRowTotals[short] = 0;
                    cropRowTotals[short] += val;
                }
            });
            
            // 6. 將計算出來的「單一作物總數」渲染到表格該列的最後一欄
            Object.keys(cropRowTotals).forEach(short => {
                const totalInput = document.getElementById(`js-total-${short}`);
                if (totalInput) {
                    const rowTotal = cropRowTotals[short];
                    totalInput.textContent = formatNum(rowTotal, '-');
                    
                    // 尋找該輸入框，獲取其所屬系列，將單列總數累加至該系列的「總」及全場的「總」
                    const inputEl = document.querySelector(`.js-inv-input[data-short="${short}"]`);
                    if (inputEl) {
                        const cat = inputEl.dataset.cat;
                        catSums[cat]['總'] += rowTotal;
                    }
                    globalSums['總'] += rowTotal;
                }
            });
            
            // 7. 將計算完畢的「各系列加總」寫入 HTML 表格中的對應欄位
            categories.forEach(cat => {
                modes.forEach(mode => {
                    document.getElementById(`js-inv-sum-${cat}-${mode}`).textContent = formatNum(catSums[cat][mode], '-');
                });
                document.getElementById(`js-inv-sum-${cat}-總`).textContent = catSums[cat]['總'].toLocaleString();
            });

            // 8. 將「全場總計」寫入全場總計列
            modes.forEach(mode => {
                const globalSumEl = document.getElementById(`js-inv-global-${mode}`);
                if (globalSumEl) globalSumEl.textContent = globalSums[mode].toLocaleString();
            });
            const globalTotalEl = document.getElementById('js-inv-global-總');
            if (globalTotalEl) globalTotalEl.textContent = globalSums['總'].toLocaleString();

            // 【同步更新】背包最上方的四格大數據看板 (大字卡)
            if (document.getElementById('js-bag-sum-normal')) {
                document.getElementById('js-bag-sum-normal').textContent = globalSums['普'].toLocaleString() + " 顆";
                document.getElementById('js-bag-sum-yi'    ).textContent = globalSums['異'].toLocaleString() + " 顆";
                document.getElementById('js-bag-sum-huan'  ).textContent = globalSums['幻'].toLocaleString() + " 顆";
                document.getElementById('js-bag-sum-total' ).textContent = globalSums['總'].toLocaleString() + " 顆";
            }      
        }

        // ============================================================
        // 【區塊六】型態刷子（普/異/幻/巨...）切換控制
        // ============================================================

        // 1. 抓取 HTML 中所有帶有 .js-type-btn 類別的型態按鈕
        const typeBtns = document.querySelectorAll('.js-type-btn');
        
        // 2. 針對每一個型態按鈕綁定點擊事件
        typeBtns.forEach(btn => {
            btn.addEventListener('click', () => setBrushStyle(btn.dataset.type));
        });

        // 3. 設定刷子型態的核心處理函式
        function setBrushStyle(styleName) {
            typeBtns.forEach(b => {
                if(b.dataset.type === styleName) b.classList.add    ('c-active');
                else                             b.classList.remove ('c-active');
            });
            currentStyle = styleName;
            if(styleName === '清') {
                if(moveModeState !== 'off') exitMoveMode();
                if(copyModeState !== 'off') exitCopyMode();
            }
        }

        // ============================================================
        // 【區塊七】地圖耕地（Cell）滑鼠與十字座標高亮事件監聽
        // ============================================================

        // 1. 處理「十字座標發光」的函式
        function highlightCrossAxes(cell, shouldHighlight) {
            // 從格子的 dataset 讀取所屬區域 (zone)、列 (row) 與行 (col)
            const zone = cell.dataset.zone;
            const row  = cell.dataset.row;
            const col  = cell.dataset.col;
            if(!zone || !row || !col) return;

            // 尋找同分區內對應 Row 與 Col 的座標標籤 HTML 元素
            const targetLabels = document.querySelectorAll(
                `.c-zone[data-zone-id="${zone}"] .c-axis-label[data-type="row"][data-val="${row}"], ` +
                `.c-zone[data-zone-id="${zone}"] .c-axis-label[data-type="col"][data-val="${col}"]`
            );

            // 根據 shouldHighlight 布林值，決定加上或移除高亮 Class
            targetLabels.forEach(label => {
                if(shouldHighlight) label.classList.add    ('c-axis-highlighted');
                else                label.classList.remove ('c-axis-highlighted');
            });
        }

        // 2. 統計表格動態連動：當滑鼠在格子上時，高亮右側對應作物的資料列
        function highlightRowInStats(cropShort) {
            clearStatsHighlight(); // 先清空先前的發光狀態
            const targetRow = document.getElementById(`js-stat-row-${cropShort}`);
            if(targetRow) targetRow.classList.add('c-highlighted-row');
        }

        // 清除統計表格高亮樣式的輔助函式
        function clearStatsHighlight() {
            document.querySelectorAll('.c-stats-table tr.c-highlighted-row')
                    .forEach(tr => tr.classList.remove('c-highlighted-row'));
        }

        // 3. 統計表格反向連動：當滑鼠移到右側統計表格時，全地圖同種作物一起發光
        function highlightCropsOnMap(cropShort) {
            clearMapCropHighlight(); // 先清空先前的發光狀態
            document.querySelectorAll(`.c-cell[data-crop="${cropShort}"]`).forEach(cell => {
                cell.classList.add('c-crop-highlight-active');
            });
        }

        function clearMapCropHighlight() {
            document.querySelectorAll('.c-cell.c-crop-highlight-active')
                    .forEach(cell => cell.classList.remove('c-crop-highlight-active'));
        }

        // 4. 全局視窗事件：放開滑鼠時重置按壓狀態，避免鼠標移出地圖後鬆開按鈕導致「連續誤刷」
        window.addEventListener('mouseup', () => { isMouseDown = false; });

        // ============================================================
        // 【區塊八】點擊分流器與核心種植塗鴉 `applyBrush()`
        // ============================================================

        // 重置單一格子狀態的通用輔助函式
        function resetCell(cell) {
            // 1. 將格子的 class 重置為基礎的 'c-cell' 樣式，移除所有背景色與特效 class
            cell.className = 'c-cell';
            // 2. 清空格子內部的所有 HTML 內容（移除顯示的作物名稱與數量標籤）
            cell.innerHTML = '';
            // 3. 刪除格子上記錄作物簡稱的 dataset 屬性
            delete cell.dataset.crop;
            // 4. 刪除格子上記錄作物型態（如：普、異、幻）的 dataset 屬性
            delete cell.dataset.style;
            // 5. 刪除格子上記錄果實數量的 dataset 屬性
            delete cell.dataset.lvl;
        }

        // 格子點擊事件的分流入口函式：根據當前模式決定執行的動作
        function handleCellClick(cell) {
            // 1. 若當前處於「交換/移動模式」
            if (moveModeState !== 'off') {
                // 轉由移動邏輯函式處理兩格之間的資料對調
                handleMoveLogic(cell);
            // 2. 若當前處於「複製模式」
            } else if (copyModeState !== 'off') {
                // 轉由複製邏輯函式擷取該格子的作物與型態設定
                handleCopyLogic(cell);
            // 3. 若處於一般模式，則直接執行塗鴉種植或清空動作
            } else {
                applyBrush(cell);
            }
        }

        // 核心種植塗鴉函式：根據當前選取的刷子屬性將作物種植到指定格子上
        function applyBrush(cell) {
            // 1. 從作物選單取得當前選擇的作物簡稱
            const cropShort = document.getElementById('js-cropSelect').value;
            // 2. 從果實數量輸入框取得數值並轉為整數，若無效或為空則預設為 1
            let level = parseInt(document.getElementById('js-levelInput').value) || 1;
            level = Math.min(9, Math.max(1, level));

            // 3. 判斷當前刷子型態是否為「擦除 (清)」或是未選取任何作物
            if (currentStyle === '清' || !cropShort) {
                // 若為擦除模式，直接呼叫重置函式將該格子恢復為空地
                resetCell(cell);
            } else {
                // 4. 根據作物簡稱查詢作物基本資訊
                const cropInfo = findCropByShort(cropShort);
                // 5. 將格子的 class 重置為基礎類別 'c-cell'，並清空舊有 HTML 內容
                cell.className = 'c-cell'; cell.innerHTML = '';
                
                // 6. 背景顏色處理
                if (currentStyle === '流') {
                    cell.classList.add('bg-style-流');
                } else if (currentStyle === '星') {
                    cell.classList.add('bg-style-星');
                } else {
                    if (cropInfo.cat === '至臻') cell.classList.add(`bg-crop-${cropShort}`);
                    else cell.classList.add(`bg-cat-${cropInfo.cat}`);
                }
                
                // 7. 【關鍵修正】所有型態都必須掛上作物分類顏色 Class（負責上排文字顏色）
                cell.classList.add(`t-${cropInfo.cat}`);

                // 8. 獨立掛上型態 Class（負責下排文字顏色與特效）
                if(currentStyle === '異') cell.classList.add('t-style-異');
                else if(currentStyle === '幻') cell.classList.add('t-style-幻');
                else if(currentStyle === '巨') cell.classList.add('t-style-巨');
                else if(currentStyle === '晶') cell.classList.add('t-style-晶');
                else if(currentStyle === '流') cell.classList.add('t-style-流');
                else if(currentStyle === '星') cell.classList.add('t-style-星');
                
                // 9. 將種植資訊儲存至 DOM 格子的 dataset 屬性中
                cell.dataset.crop = cropShort; cell.dataset.style = currentStyle; cell.dataset.lvl = level;
                let displayTypeLabel = currentStyle === '普' ? '' : currentStyle + ' ';
                cell.innerHTML = `<span class="c-crop-text">${cropShort}</span><span class="c-level-text">${displayTypeLabel}${level}</span>`;
            }
            // 10. 重新計算全區統計數據
            calculateStats(); 
            // 11. 若格子上有作物，高亮顯示右側統計表格中對應作物的資料列
            if(cell.dataset.crop) highlightRowInStats(cell.dataset.crop);
            // 12. 自動將最新的耕地數據與配置同步保存至瀏覽器的 localStorage
            autoSaveData();
        }

        // ============================================================
        // 【區塊九】進階模式開關與互斥安全控制
        // ============================================================

        // 1. 取得進階模式按鈕 DOM 元素
        const moveModeBtn = document.getElementById('js-moveModeBtn');
        const copyModeBtn = document.getElementById('js-copyModeBtn');

        // 2. 交換模式按鈕點擊事件監聽與互斥邏輯
        moveModeBtn.addEventListener('click', () => {
            exitCopyMode();
            if (moveModeState === 'off') enterMoveMode(); else exitMoveMode();
        });

        // 3. 複製模式按鈕點擊事件監聽與互斥邏輯
        copyModeBtn.addEventListener('click', () => {
            exitMoveMode();
            if (copyModeState === 'off') enterCopyMode(); else exitCopyMode();
        });

        // 4. 進入「交換模式」狀態初始化函式
        function enterMoveMode() {
            moveModeState           = 'pick_src';
            moveModeBtn.className   = 'c-btn c-btn-move-src';
            moveModeBtn.textContent = '🔄 請點選：起點格/田標題';
            if(moveSourceCell) moveSourceCell.classList.remove('c-move-pending-source');
            moveSourceCell          = null;

            // 清除舊的整塊田高亮[cite: 4]
            if(zoneMoveSource) {
                document.querySelector(`.c-zone[data-zone-id="${zoneMoveSource}"] .c-zone-title`)?.classList.remove('c-zone-pending-source');
                zoneMoveSource = null;
            }
            document.body.classList.add('is-move-mode'); // 啟用 CSS 懸停樣式
        }

        // 5. 退出「交換模式」狀態重置函式
        function exitMoveMode() {
            moveModeState           = 'off';
            moveModeBtn.className   = 'c-btn c-btn-move-inactive';
            moveModeBtn.textContent = '🔄 交換模式：關閉';
            if(moveSourceCell) moveSourceCell.classList.remove('c-move-pending-source');
            moveSourceCell          = null;

            // 清除舊的整塊田高亮[cite: 4]
            if(zoneMoveSource) {
                document.querySelector(`.c-zone[data-zone-id="${zoneMoveSource}"] .c-zone-title`)?.classList.remove('c-zone-pending-source');
                zoneMoveSource = null;
            }
            document.body.classList.remove('is-move-mode');
        }

        // 6. 進入「複製模式」狀態初始化函式
        function enterCopyMode() {
            copyModeState           = 'on';
            copyModeBtn.className   = 'c-btn c-btn-copy-src';
            copyModeBtn.textContent = '📋 請點選：擷取格';
            if(copySourceCell) copySourceCell.classList.remove('c-copy-pending-source'); // ★ 清除舊的高亮
            copySourceCell          = null;
        }
        function exitCopyMode() {
            copyModeState           = 'off';
            copyModeBtn.className   = 'c-btn c-btn-copy-inactive';
            copyModeBtn.textContent = '📋 複製模式：關閉';
            if(copySourceCell) copySourceCell.classList.remove('c-copy-pending-source'); // ★ 清除舊的高亮
            copySourceCell          = null;
        }

        // ============================================================
        // 【區塊十】交換與複製模式核心邏輯處理
        // ============================================================

        // 1. 複製模式邏輯
        function handleCopyLogic(cell) {
            if (!cell.dataset.crop) {
                alert('❌ 此格子為空，無法複製作物！');
                return;
            }
            // 讀取數據與同步控制台
            const cropShort = cell.dataset.crop;
            const cropStyle = cell.dataset.style || '普';
            const cropLvl   = cell.dataset.lvl   || 1;

            selectCrop   (cropShort);  // 下拉+快捷
            setBrushStyle(cropStyle);  // 型態
            document.getElementById('js-levelInput').value = cropLvl; // 數量
            
            // 狀態回饋與自動退出
            showStatus(`📋 已擷取作物：${cropShort} (${cropStyle}${cropLvl})`);
            exitCopyMode();
        }

        // 2. 交換模式邏輯
        function handleMoveLogic(cell) {
            // 階段一：指定起點格
            if (moveModeState === 'pick_src') {
                moveSourceCell          = cell; cell.classList.add('c-move-pending-source');
                moveModeState           = 'pick_dst';
                moveModeBtn.className   = 'c-btn c-btn-move-dst'; 
                moveModeBtn.textContent = '🔄 請點選：終點格';
            } 
            // 階段二：指定終點格與資料對調
            else if (moveModeState === 'pick_dst') {
                // 點擊原本的起點格，視為取消選擇
                if (cell === moveSourceCell) {
                    cell.classList.remove('c-move-pending-source'); enterMoveMode(); return;
                }
                // 擷取兩格數據並對調
                const srcData = {
                    crop: moveSourceCell.dataset.crop, style: moveSourceCell.dataset.style, lvl: moveSourceCell.dataset.lvl,
                    html: moveSourceCell.innerHTML, className: moveSourceCell.className.replace('c-move-pending-source', '').trim()
                };
                const dstData = {
                    crop: cell.dataset.crop, style: cell.dataset.style, lvl: cell.dataset.lvl,
                    html: cell.innerHTML, className: cell.className
                };
                // 將終點資料寫入起點、將起點資料寫入終點
                writeCellData(moveSourceCell, dstData); writeCellData(cell, srcData);
                // 完成與收尾
                moveSourceCell.classList.remove('c-move-pending-source');
                showStatus('🔄 移動數據交換成功！'); calculateStats(); autoSaveData(); enterMoveMode();
            }
        }

        // 處理田地標題點擊 (整塊批次交換)
        function handleZoneTitleClick(zoneId) {
            if (moveModeState === 'off') return;

            const currentTitle = document.querySelector(`.c-zone[data-zone-id="${zoneId}"] .c-zone-title`);

            // 如果先前已經單選了某個格子，先取消單格選取
            if (moveSourceCell) {
                moveSourceCell.classList.remove('c-move-pending-source');
                moveSourceCell = null;
            }

            // 階段一：指定起點田
            if (!zoneMoveSource) {
                zoneMoveSource = zoneId;
                currentTitle.classList.add('c-zone-pending-source');
                moveModeBtn.className   = 'c-btn c-btn-move-dst';
                moveModeBtn.textContent = '🔄 請點選：終點格/田標題';
                showStatus(`🔄 已選取第 ${zoneId} 塊田，請選擇對調標題`);
            } 
            
            // 階段二：指定終點田並對調
            else {
                if (zoneMoveSource === zoneId) {
                    currentTitle.classList.remove('c-zone-pending-source');
                    enterMoveMode();
                    return;
                }

                // 1. 先記錄起點田地編號
                const tempSrcZone = zoneMoveSource;

                // 2. 對調兩塊田的所有 8x8 格子
                swapWholeZone(tempSrcZone, zoneId);

                // 3. 清除高亮與狀態
                document.querySelector(`.c-zone[data-zone-id="${tempSrcZone}"] .c-zone-title`)?.classList.remove('c-zone-pending-source');
                zoneMoveSource = null;

                // 4. 帶入正確的 tempSrcZone 顯示提示
                showStatus(`🔄 第 ${tempSrcZone} 塊田與第 ${zoneId} 塊田全數作物交換成功！`);
                calculateStats();
                autoSaveData();
                enterMoveMode();
            }
        }

        // 執行兩塊田地的全數單元格資料交換
        function swapWholeZone(srcZone, dstZone) {
            const srcCells = document.querySelectorAll(`.c-cell[data-zone="${srcZone}"]`);
            
            // 判斷兩塊田地的奇偶性是否不同（例如：奇數田 ↔ 偶數田 交換）
            const isSrcEven = (Number(srcZone) % 2 === 0);
            const isDstEven = (Number(dstZone) % 2 === 0);
            const isCrossParity = (isSrcEven !== isDstEven);

            srcCells.forEach(srcCell => {
                const row = srcCell.dataset.row;
                const col = srcCell.dataset.col;
                
                // 若為「奇數田與偶數田互相交換」，目標格子的 Column 需進行反轉 (9 - col) 避開鏡像
                const targetCol = isCrossParity ? (9 - Number(col)).toString() : col;

                const dstCell = document.querySelector(`.c-cell[data-zone="${dstZone}"][data-row="${row}"][data-col="${targetCol}"]`);

                if (dstCell) {
                    const srcData = {
                        crop: srcCell.dataset.crop, style: srcCell.dataset.style, lvl: srcCell.dataset.lvl,
                        html: srcCell.innerHTML, className: srcCell.className.replace('c-move-pending-source', '').trim()
                    };
                    const dstData = {
                        crop: dstCell.dataset.crop, style: dstCell.dataset.style, lvl: dstCell.dataset.lvl,
                        html: dstCell.innerHTML, className: dstCell.className.replace('c-move-pending-source', '').trim()
                    };

                    writeCellData(srcCell, dstData);
                    writeCellData(dstCell, srcData);
                }
            });
        }

        // 土地 DOM 屬性寫入核心工具
        function writeCellData(targetCell, data) {
            // 取得當前的座標與區域資訊
            const zone = targetCell.dataset.zone;
            const row  = targetCell.dataset.row;
            const col  = targetCell.dataset.col;

            // 先完全清空該格子
            resetCell(targetCell);

            // 補回座標屬性
            targetCell.dataset.zone = zone;
            targetCell.dataset.row  = row;
            targetCell.dataset.col  = col;

            // 寫入新資料
            targetCell.className = data.className; 
            targetCell.innerHTML = data.html;
            if(data.crop)  targetCell.dataset.crop  = data.crop;
            if(data.style) targetCell.dataset.style = data.style;
            if(data.lvl)   targetCell.dataset.lvl   = data.lvl;
        }

        // ============================================================
        // 【區塊十一】田間栽種數據即時分析統計與渲染
        // ============================================================

        function calculateStats() {
            // 1. 抓取全場所有「有種植作物」的土地格子
            const activeCells = document.querySelectorAll('.c-cell[data-crop]');
            const statsMap    = {}; 
            
            // 初始化全場 7 種型態的總計累加器
            let globalTypeTotals  = { 普: 0, 異: 0, 幻: 0, 巨: 0, 晶: 0, 流: 0, 星: 0 };
            let totalPlantedGrids = activeCells.length;  // 已用格數
            let totalSeedsCount   = 0;                   // 果實總顆數

            // 2. 遍歷每一個有作物的格子，進行數據統計
            activeCells.forEach(cell => {
                const crop  = cell.dataset.crop; 
                const style = cell.dataset.style || '普'; 
                const lvl   = parseInt(cell.dataset.lvl) || 1;
                if(!crop) return;
                
                totalSeedsCount += lvl;      // 累加果實顆數
                globalTypeTotals[style]++;   // 累加該型態的全場數量
                
                // 若統計表尚未記錄此作物，進行初始化建立
                if(!statsMap[crop]) {
                    const info = findCropByShort(crop);
                    statsMap[crop] = { 
                        // ★【修正點 2】：找不到時直接使用 crop (簡稱)，不使用「其他」
                        name: info?.name || crop, 
                        cat:  info?.cat  || '錯誤', 
                        普: 0, 異: 0, 幻: 0, 巨: 0, 晶: 0, 流: 0, 星: 0,
                        fruitSum: 0 
                    };
                }
                // 累加單一作物的型態與果實數
                statsMap[crop][style]++;
                statsMap[crop].fruitSum += lvl; 
            });

            // 3. 更新右側面板最上方的數據儀表板
            document.getElementById('js-statPlantedGrids').textContent = totalPlantedGrids.toLocaleString() + " 格";
            document.getElementById('js-statRemainGrids' ).textContent = (512 - totalPlantedGrids).toLocaleString() + " 格";
            document.getElementById('js-statTotalSeeds'  ).textContent = totalSeedsCount.toLocaleString() + " 顆";

            const statsBody = document.getElementById('js-statsBody'); 
            statsBody.innerHTML = '';  // 清空舊的表格渲染內容
            
            const types = ['普', '異', '幻', '巨', '晶', '流', '星'];
            const globalCellsHtml = types.map(t => `<td data-type="${t}">${globalTypeTotals[t].toLocaleString()}</td>`).join('');
            const globalSum = types.reduce((acc, t) => acc + globalTypeTotals[t], 0);

            const summaryTr = document.createElement('tr'); 
            summaryTr.classList.add('c-total-type-row');
            summaryTr.innerHTML = `
                <td>全部田間總計</td>
                ${globalCellsHtml}
                <td class="c-stat-bg-total">${globalSum.toLocaleString()}</td>
                <td class="c-stat-bg-fruit">${totalSeedsCount.toLocaleString()}</td>
            `;
            statsBody.appendChild(summaryTr);

            // 4. 防錯機制：如果田間完全沒有種植任何作物，顯示「暫無耕作數據」並結束
            if(totalPlantedGrids === 0) {
                statsBody.innerHTML += `<tr><td colspan="10" class="c-no-data-msg">暫無耕作數據</td></tr>`; 
                return;
            }

            // 5. 按稀有度分類（至臻 ➔ 橙色 ➔ ... ➔ 錯誤）依序生成明細表格
            const categoriesOrder = ['至臻', '橙色', '紫色', '藍色', '綠色', '灰色', '錯誤'];
            categoriesOrder.forEach(currentCat => {
                let catCrops = [];
                if (currentCat === '錯誤') {
                    // ★【修正點 2】：舊作物直接以簡稱進行顯示與歸歸類
                    catCrops = Object.keys(statsMap)
                        .filter(k => statsMap[k].cat === '錯誤')
                        .map(k => ({ short: k, name: statsMap[k].name }));
                } else {
                    catCrops = cropsData[currentCat].filter(c => statsMap[c.short]);
                }
                
                if (catCrops.length > 0) {
                    const isErrorCat = (currentCat === '錯誤');

                    // 建立跨 10 欄的系列分類標題列
                    const catTitleTr = document.createElement('tr');
                    const titleClass = isErrorCat ? 'c-cat-row-error' : 'c-cat-row';
                    const titleLabel = isErrorCat ? '⚠️ 舊版/未記錄作物' : `★ ${currentCat}系列`;
                    catTitleTr.innerHTML = `<td colspan="10" class="${titleClass}">${titleLabel}</td>`;
                    statsBody.appendChild(catTitleTr);

                    // 初始化該稀有度系列的專屬小計歸納器
                    let catSubTotals = { 普: 0, 異: 0, 幻: 0, 巨: 0, 晶: 0, 流: 0, 星: 0, fruitSum: 0 };
                    
                    // 遍歷該系列下各個有種植的作物
                    catCrops.forEach(c => {
                        const item = statsMap[c.short];
                        const itemSum = types.reduce((acc, t) => acc + item[t], 0);
                        
                        types.forEach(t => catSubTotals[t] += item[t]);
                        catSubTotals.fruitSum += item.fruitSum;

                        const itemTr     = document.createElement('tr');
                        itemTr.id        = `js-stat-row-${c.short}`; 
                        itemTr.className = 'c-stat-item-row';
                        
                        const itemCellsHtml = types.map(t => `<td data-type="${t}">${formatNum(item[t], '-')}</td>`).join('');

                        // 若為錯誤/舊作物，顯示名稱時掛上紅字標籤
                        const nameClass = isErrorCat ? 't-錯誤' : `t-${currentCat}`;

                        itemTr.innerHTML = `   
                            <td class="${nameClass} c-stat-text-left" style="font-weight:bold;">${item.name}</td>
                            ${itemCellsHtml}
                            <td class="c-stat-bg-sub">${itemSum.toLocaleString()}</td>
                            <td class="c-stat-bg-item-fruit">${item.fruitSum.toLocaleString()}</td>
                        `;
                        
                        itemTr.addEventListener('mouseenter', () => highlightCropsOnMap(c.short));
                        itemTr.addEventListener('mouseleave', () => clearMapCropHighlight());

                        statsBody.appendChild(itemTr);
                    });

                    const catSubCellsHtml = types.map(t => `<td data-type="${t}">${formatNum(catSubTotals[t], '-')}</td>`).join('');
                    const catSumSum = types.reduce((acc, t) => acc + catSubTotals[t], 0);

                    const catSumTr = document.createElement('tr'); 
                    catSumTr.classList.add('c-cat-sum-row');
                    catSumTr.innerHTML = `
                        <td class="c-stat-text-left">系列小計</td>
                        ${catSubCellsHtml}
                        <td>${catSumSum.toLocaleString()}</td>
                        <td class="c-stat-text-danger">${catSubTotals.fruitSum.toLocaleString()}</td>
                    `;
                    statsBody.appendChild(catSumTr);
                }
            });
        }

        // ============================================================
        // 【區塊十二】輔助工具按鈕控制與狀態發布
        // ============================================================

        const dragModeBtn = document.getElementById('js-dragModeBtn');
        dragModeBtn.addEventListener('click', () => {
            isDragMode = !isDragMode;
            syncDragModeUI();
        });

        // 獨立出連續塗鴉按鈕的外觀刷新函式，便於多處呼叫
        function syncDragModeUI() {
            if (isDragMode) { 
                dragModeBtn.textContent = '連續塗鴉：開啟'; 
                dragModeBtn.classList.add('c-active');
            } else { 
                dragModeBtn.textContent = '連續塗鴉：關閉'; 
                dragModeBtn.classList.remove('c-active');
            }
        }

        // 清除功能 Modal 邏輯
        const clearModal = document.getElementById('js-clearModal');
        const clearAllBtn = document.getElementById('js-clearAllBtn');
        const clearModalCancel = document.getElementById('js-clearModalCancel');
        const clearModalConfirm = document.getElementById('js-clearModalConfirm');

        // 開啟 Modal 快選單
        clearAllBtn.addEventListener('click', () => {
            clearModal.classList.add('c-modal-open');
        });

        // 關閉 Modal 快選單
        function closeClearModal() {
            clearModal.classList.remove('c-modal-open');
        }

        clearModalCancel.addEventListener('click', closeClearModal);

        // 點擊背景空白處也可關閉 Modal
        clearModal.addEventListener('click', (e) => {
            if (e.target === clearModal) closeClearModal();
        });

        // 清除地圖作物的獨立輔助函式
        function clearMapCrops() {
            exitMoveMode(); 
            exitCopyMode(); 
            clearMapCropHighlight();
            document.querySelectorAll('.c-cell').forEach(cell => {
                resetCell(cell);
            });
            calculateStats();
        }

        // 清除背包庫存的獨立輔助函式
        function clearBagInventory() {
            document.querySelectorAll('.c-inv-input').forEach(input => {
                input.value = '';
            });
            calculateInvTotals();
        }

        // 點擊「確定」執行對應清除動作
        clearModalConfirm.addEventListener('click', () => {
            const selectedOption = document.querySelector('input[name="clearOption"]:checked')?.value;

            if (selectedOption === 'bag') {
                clearBagInventory();
                showStatus('🧹 已清空背包庫存！');
            } else if (selectedOption === 'map') {
                clearMapCrops();
                showStatus('🧹 已清空田間作物！');
            } else if (selectedOption === 'all') {
                clearBagInventory();
                clearMapCrops();
                showStatus('🧹 已清空背包與田間作物！');
            }
            autoSaveData();
            closeClearModal();
        });

        function showStatus(msg) {
            const statusEl = document.getElementById('js-saveStatus'); statusEl.textContent = msg;
            setTimeout(() => { statusEl.textContent = '● 系統防丟護航中'; }, 3000);
        }

        // ============================================================
        // 【區塊十三】本地瀏覽器快取儲存與資料修復載入
        // ============================================================

        function autoSaveData() {
            const mapState = [];
            document.querySelectorAll('.c-cell[data-crop]').forEach(cell => {
                mapState.push({ z: cell.dataset.zone, r: cell.dataset.row, c: cell.dataset.col, crop: cell.dataset.crop, style: cell.dataset.style, lvl: cell.dataset.lvl });
            });
            const invState = [];
            document.querySelectorAll('.c-inv-input').forEach(input => {
                const val = parseInt(input.value) || 0;
                if(val > 0) invState.push({ short: input.dataset.short, mode: input.dataset.mode, val: val });
            });
            localStorage.setItem(STORAGE_KEY, JSON.stringify({ map: mapState, inventory: invState }));
        }

        function loadData() {
            const saved = localStorage.getItem(STORAGE_KEY); if (!saved) return;
            try {
                const totalPackage = JSON.parse(saved);
                // 1. 徹底清空當前地圖格子狀態
                document.querySelectorAll('.c-cell').forEach(cell => {
                    resetCell(cell);
                });
               
                // 2. 恢復地圖資料
                if(totalPackage.map) {
                    totalPackage.map.forEach(item => {
                        let currentShort = item.crop;
                        if(item.crop && item.crop.length === 1) {
                            const found = findCropByShort(item.crop);
                            if(found) currentShort = found.short;
                        }
                        const cell = document.querySelector(`.c-cell[data-zone="${item.z}"][data-row="${item.r}"][data-col="${item.c}"]`);
                        if(cell) {
                            const cropInfo = findCropByShort(currentShort);

                            if(cropInfo) {
                                // ---- 已知作物的正常渲染邏輯 ----
                                const cropCat = cropInfo.cat;
                                if (item.style === '流') {
                                    cell.classList.add('bg-style-流');
                                } else if (item.style === '星') {
                                    cell.classList.add('bg-style-星');
                                } else {
                                    if (cropCat === '至臻') {
                                        cell.classList.add(`bg-crop-${currentShort}`);
                                    } else {
                                        cell.classList.add(`bg-cat-${cropCat}`);
                                    }
                                }

                                cell.classList.add(`t-${cropInfo.cat}`);

                                if(item.style === '巨') cell.classList.add('t-style-巨');
                                else if(item.style === '異') cell.classList.add('t-style-異');
                                else if(item.style === '幻') cell.classList.add('t-style-幻');
                                else if(item.style === '晶') cell.classList.add('t-style-晶');
                                else if(item.style === '流') cell.classList.add('t-style-流');
                                else if(item.style === '星') cell.classList.add('t-style-星');
                            } else {
                                // ★【修正點 1】：找不到名稱的舊作物
                                // 不套用 .bg-cat-錯誤 (粉底)，預設保持白底，並掛上 .t-錯誤 (紅字)
                                cell.classList.add('t-錯誤');
                            }

                            cell.dataset.crop = currentShort; 
                            cell.dataset.style = item.style || '普'; 
                            cell.dataset.lvl = item.lvl || 1;
                            
                            let styleLabel = item.style === '普' ? '' : (item.style + ' ');
                            cell.innerHTML = `<span class="c-crop-text">${currentShort}</span><span class="c-level-text">${styleLabel}${item.lvl || 1}</span>`;
                        }
                    });
                }
                
                // 3. 恢復背包資料
                document.querySelectorAll('.c-inv-input').forEach(input => {
                    input.value = '';
                });
                if(totalPackage.inventory) {
                    totalPackage.inventory.forEach(item => {
                        let currentShort = item.short;
                        if(item.short && item.short.length === 1) {
                            const found = findCropByShort(item.short);
                            if(found) currentShort = found.short;
                        }
                        const input = document.querySelector(`.c-inv-input[data-short="${currentShort}"][data-mode="${item.mode}"]`);
                        if(input && item.val > 0) input.value = item.val;
                    });
                }
                calculateInvTotals(); calculateStats();
                if(document.getElementById('js-cropSelect').value) syncQuickCropButtons(document.getElementById('js-cropSelect').value);
            } catch(e) { console.error(e); }    
        }

        // ============================================================
        // 【區塊十四】資料備份檔案下載導出與本地文件讀取還原
        // ============================================================
        
        // 1. 手動點擊保存按鈕
        document.getElementById('js-saveBtn').addEventListener('click', () => { 
            autoSaveData(); 
            showStatus('💾 資料保存成功！'); 
        });

        // 2. 備份資料導出下載 (.txt)
        document.getElementById('js-exportBtn').addEventListener('click', () => {
            autoSaveData(); 
            const saved = localStorage.getItem(STORAGE_KEY) || "{}";
            
            // 建立 Blob 與 下載物件 URL
            const blob = new Blob([saved], { type: "text/plain;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            
            // 格式化日期檔名（例：瘋農備份資料_2026-08-13.txt）
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const dateStr = `${year}.${month}.${day}`;
            
            a.href = url;
            a.download = `瘋農備份資料_${dateStr}.txt`;
            a.click();
            
            // 釋放記憶體 URL 資源
            URL.revokeObjectURL(url);
            showStatus('📤 備份檔案已成功導出！');
        });

        // 3. 本地備份檔案讀取與還原
        const importBtn = document.getElementById('js-importBtn');
        const fileInput = document.getElementById('js-fileInput');

        importBtn.addEventListener('click', () => {
            fileInput.click(); 
        });

        fileInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            
            reader.onload = function(e) {
                const fileContent = e.target.result;
                
                try {
                    const parsedData = JSON.parse(fileContent); 
                    
                    // 檢查 JSON 格式是否為合法物件
                    if (typeof parsedData !== 'object' || parsedData === null) {
                        throw new Error('無效的備份格式');
                    }

                    // 寫入 LocalStorage 快取並重新渲染畫面
                    localStorage.setItem(STORAGE_KEY, fileContent); 
                    loadData(); 
                    showStatus('🎉 數據檔案匯入成功並已成功還原！');
                    
                } catch (error) {
                    alert('❌ 還原失敗：檔案內容格式不正確，請確認是正確的農場備份文字檔。');
                } finally {
                    // 重設 input 值，確保重複選擇同一檔案時能再次觸發 change 事件
                    fileInput.value = '';
                }
            };

            // 處理檔案讀取例外狀況
            reader.onerror = function() {
                alert('❌ 檔案讀取失敗，請重新嘗試！');
                fileInput.value = '';
            };

            reader.readAsText(file, 'UTF-8');
        });

        // ============================================================
        // 【區塊十五】全網頁 DOM 載入完畢守護初始化
        // ============================================================      

        window.addEventListener('DOMContentLoaded', () => { initUI(); loadData(); });

    </script>
</body>
</html>
